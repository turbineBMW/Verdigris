[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iphonebridge"
version = "0.4.2"
description = "Blue — iPhone messages, calls, and notifications on your Linux desktop"
authors = [{name = "Gabe Shatunovsky", email = "gabriel@shatunovsky.com"}]
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.10"
readme = "README.md"
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "typer>=0.12",
  # NOTE: dbus-python and PyGObject are installed via apt
  # (python3-dbus, python3-gi) and intentionally NOT pulled from PyPI —
  # the PyPI versions are notoriously fragile to build. The venv that
  # runs this package should be created with --system-site-packages.
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "ruff>=0.5",
]
# The Qt/QML desktop app. Optional so the daemon keeps working on machines
# without Qt; only `iphonebridge-qt` needs it.
qt = [
  "PySide6>=6.6",
]

[project.scripts]
# Product CLI is `blue`. `iphonebridge` remains as a compatibility alias.
blue = "iphonebridge.cli:app"
iphonebridge = "iphonebridge.cli:app"

[project.gui-scripts]
blue-qt = "iphonebridge.qtui.app:main"
iphonebridge-qt = "iphonebridge.qtui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

# QML, Lucide icons, and glossy tapback PNGs live next to the Python package
# and are resolved at runtime via Theme.assetUrl / reactionUrl.
[tool.setuptools.package-data]
iphonebridge = [
  "qtui/qml/**/*.qml",
  "qtui/qml/**/qmldir",
  "qtui/assets/**/*",
]

[tool.pytest.ini_options]
# Without this, a bare `pytest` from the repo root recurses the whole tree
# (src/, spike/, .venv probing, …) during collection and can hang. Scope
# collection to the test suite — matches what CI runs.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = [
  "B904",   # `raise ... from err` not enforced — too pedantic for this size of project
  "RUF005", # iterable unpacking vs `+` — readability is a wash here
  "RUF012", # class-level constant dicts; ClassVar annotations add noise, not safety
  "RUF001", # curly quotes in comments and emoji in tables are deliberate, not typos
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # tests can have long lines for readability of bMessage fixtures
# Qt's model API dictates the signature: `parent: QModelIndex = QModelIndex()`.
"src/iphonebridge/qtui/models.py" = ["B008"]
