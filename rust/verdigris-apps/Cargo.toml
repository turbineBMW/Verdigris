[workspace]
members = ["."]
resolver = "3"

[package]
name = "verdigris-apps"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1"
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs", "io-util"] }
async-channel = "2"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rusqlite = "0.40"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
secret-service = { version = "5", features = ["rt-tokio-crypto-rust"] }
rust_socketio = { version = "0.6", features = ["async"] }

[[bin]]
name = "verdigris-messages"
path = "src/bin/messages.rs"

[[bin]]
name = "verdigris-phone"
path = "src/bin/phone.rs"

[[bin]]
name = "verdigris-settings"
path = "src/bin/settings.rs"

[[bin]]
name = "verdigris-sync"
path = "src/bin/sync.rs"
